<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxomOps AI Logistics Agent</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

<div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
    
    <!-- Header with Branding & Reset Button -->
    <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-4">
        <div class="flex items-center gap-3">
            <!-- AI Avatar / Persona Icon -->
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-slate-950 font-bold shadow-lg border border-cyan-400">
                🤖
            </div>
            <div>
                <h1 class="text-base font-bold text-cyan-400">AxomOps AI Agent</h1>
                <p class="text-xs text-emerald-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live Logistics Command
                </p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <select id="chatLanguage" class="bg-slate-800 border border-slate-700 text-xs rounded-lg p-1.5 text-slate-200 focus:outline-none focus:border-cyan-500">
                <option value="en-US">English</option>
                <option value="as-IN">Assamese</option>
                <option value="hi-IN">Hindi</option>
                <option value="bn-IN">Bengali</option>
            </select>
            <button onclick="resetChat()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1.5 rounded-lg border border-slate-700 transition" title="Clear Chat">
                🔄 Reset
            </button>
        </div>
    </div>

    <!-- Chat Box Container -->
    <div id="chatBox" class="h-72 overflow-y-auto space-y-3 mb-3 p-3 bg-slate-950 rounded-xl border border-slate-800/50 text-sm">
        <!-- Messages injected dynamically -->
    </div>

    <!-- Quick Action Chips (One-click queries) -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-2 no-scrollbar">
        <button onclick="sendQuickQuery('Track my shipment')" class="text-xs bg-slate-800 hover:bg-cyan-950 border border-slate-700 hover:border-cyan-500 text-slate-300 px-3 py-1.5 rounded-full whitespace-nowrap transition">
            📦 Track Shipment
        </button>
        <button onclick="sendQuickQuery('Hill terrain routes')" class="text-xs bg-slate-800 hover:bg-cyan-950 border border-slate-700 hover:border-cyan-500 text-slate-300 px-3 py-1.5 rounded-full whitespace-nowrap transition">
            ⛰️ Hill Routing
        </button>
        <button onclick="sendQuickQuery('Coverage area pincode')" class="text-xs bg-slate-800 hover:bg-cyan-950 border border-slate-700 hover:border-cyan-500 text-slate-300 px-3 py-1.5 rounded-full whitespace-nowrap transition">
            📍 Pincode Support
        </button>
    </div>

    <!-- Input Bar -->
    <div class="flex items-center gap-2 pt-2 border-t border-slate-800">
        <input type="text" id="chatInput" placeholder="Type or use mic in any language..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-100">
        <button id="micBtn" onclick="toggleVoiceInput()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-cyan-400 transition" title="Voice Input">
            🎤
        </button>
        <button onclick="handleChatQuery()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-cyan-500/20">
            Send
        </button>
    </div>
</div>

<script>
// Auto-Greeting on Page Load
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        const hour = new Date().getHours();
        let timeGreeting = "Hello";
        if (hour < 12) timeGreeting = "Good Morning";
        else if (hour < 18) timeGreeting = "Good Afternoon";
        else timeGreeting = "Good Evening";

        const welcomeMessage = `${timeGreeting}! Welcome to AxomOps AI Logistics Command. I am your live AI Agent. How can I assist your supply chain operations today? (আপুনি যিকোনো প্ৰশ্ন সুধিব পাৰে।)`;
        
        appendMessage("AxomOps AI", welcomeMessage, "ai");
        speakResponse(welcomeMessage);
    }, 400);
});

function appendMessage(sender, text, type) {
    const chatBox = document.getElementById('chatBox');
    const isAi = type === 'ai';
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `flex flex-col ${isAi ? 'items-start' : 'items-end'} mb-2`;
    
    messageDiv.innerHTML = `
        <div class="${isAi ? 'bg-cyan-950/40 border border-cyan-800/50 text-cyan-200' : 'bg-cyan-600 text-slate-950 font-medium'} p-3 rounded-2xl max-w-[85%] text-sm leading-relaxed shadow-md">
            ${text}
        </div>
    `;
    chatBox.appendChild(messageDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function sendQuickQuery(queryText) {
    document.getElementById('chatInput').value = queryText;
    handleChatQuery();
}

function toggleVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser. Please use Chrome.");
        return;
    }
    const recognition = new SpeechRecognition();
    const langSelect = document.getElementById('chatLanguage');
    recognition.lang = langSelect ? langSelect.value : 'en-US';

    const micBtn = document.getElementById('micBtn');
    micBtn.classList.add('bg-red-500/20', 'border-red-500', 'text-red-400', 'animate-pulse');

    recognition.onresult = function(event) {
        const speechToText = event.results[0][0].transcript;
        document.getElementById('chatInput').value = speechToText;
        micBtn.classList.remove('bg-red-500/20', 'border-red-500', 'text-red-400', 'animate-pulse');
        handleChatQuery();
    };

    recognition.onerror = () => micBtn.classList.remove('bg-red-500/20', 'border-red-500', 'text-red-400', 'animate-pulse');
    recognition.onend = () => micBtn.classList.remove('bg-red-500/20', 'border-red-500', 'text-red-400', 'animate-pulse');

    recognition.start();
}

function speakResponse(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/<[^>]*>?/gm, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        const langSelect = document.getElementById('chatLanguage');
        utterance.lang = langSelect ? langSelect.value : 'en-US';
        window.speechSynthesis.speak(utterance);
    }
}

async function handleChatQuery() {
    const chatInput = document.getElementById('chatInput');
    const query = chatInput.value.trim();
    if (!query) return;

    appendMessage("You", escapeHtml(query), "user");
    chatInput.value = '';

    // Simulating intelligent AI processing delay
    setTimeout(() => {
        let reply = generateSmartReply(query);
        appendMessage("AxomOps AI", reply, "ai");
        speakResponse(reply);
    }, 600);
}

function generateSmartReply(text) {
    const lowerText = text.toLowerCase();

    if (lowerText.includes('নমস্কাৰ') || lowerText.includes('অসমীয়া')) {
        return "নমস্কাৰ! AxomOps AI লজিস্টিকছলৈ আপোনাক স্বাগতম। আমাৰ চিষ্টেম সম্পূৰ্ণৰূপে সক্ৰিয় আছে। আপোনাক কি সহায় লাগে কওক?";
    } else if (lowerText.includes('नमस्ते') || lowerText.includes('हिंदी')) {
        return "नमस्ते! AxomOps AI लॉजिस्टिक्स कमांड में आपका स्वागत है। बताइए, मैं आपकी किस प्रकार सहायता कर सकता हूँ?";
    } else if (lowerText.includes('track') || lowerText.includes('status') || lowerText.includes('shipment')) {
        return "📦 **Telemetry Status:** Your shipment pipeline is active. Please provide your 6-digit Tracking ID or Pincode for real-time tracking metrics.";
    } else if (lowerText.includes('hill') || lowerText.includes('terrain') || lowerText.includes('route')) {
        return "⛰️ **Hill-Terrain Routing:** AxomOps AI monitors all mountain corridors across Tinsukia, Northeast, and remote sectors for safe dispatch.";
    } else {
        return `🤖 **AxomOps AI Response:** I have analyzed your query regarding "${escapeHtml(text)}". Our logistics network is optimized for multi-lingual operations and real-time support. Let me know if you need specific tracking or warehouse reports!`;
    }
}

function resetChat() {
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML = '';
    window.speechSynthesis.cancel();
    triggerAutoGreeting();
}

function triggerAutoGreeting() {
    const welcomeMessage = "Hello! Welcome back to AxomOps AI Logistics Command. How can I assist your operations?";
    appendMessage("AxomOps AI", welcomeMessage, "ai");
    speakResponse(welcomeMessage);
}

function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}
</script>

</body>
</html>
