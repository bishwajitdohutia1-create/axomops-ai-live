
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxomOps AI Logistics Agent</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

<div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-4">
        <h1 class="text-xl font-bold text-cyan-400">AxomOps AI Logistics Agent</h1>
        <select id="chatLanguage" class="bg-slate-800 border border-slate-700 text-sm rounded-lg p-1 text-slate-200">
            <option value="en-US">English</option>
            <option value="as-IN">Assamese</option>
            <option value="hi-IN">Hindi</option>
            <option value="bn-IN">Bengali</option>
        </select>
    </div>

    <div id="chatBox" class="h-80 overflow-y-auto space-y-3 mb-4 p-2 bg-slate-950 rounded-xl border border-slate-800/50 text-sm">
        <!-- Dynamic messages will appear here -->
    </div>

    <div class="flex items-center gap-2">
        <input type="text" id="chatInput" placeholder="Type or use mic in any language..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
        <button id="micBtn" onclick="toggleVoiceInput()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-cyan-400" title="Voice Input">
            🎤
        </button>
        <button onclick="handleChatQuery()" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-semibold px-4 py-2 rounded-xl text-sm transition-all">
            Send
        </button>
    </div>
</div>

<script>
// Auto-Greeting on Page Load
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        const hour = new Date().getHours();
        let timeGreeting = "Hello";
        if (hour < 12) timeGreeting = "Good Morning";
        else if (hour < 18) timeGreeting = "Good Afternoon";
        else timeGreeting = "Good Evening";

        const welcomeMessage = `${timeGreeting}! Welcome to AxomOps AI Logistics Command. I am your live AI Agent. How can I assist your supply chain operations today? (আপুনি যিকোনো প্ৰশ্ন সুধিব পাৰে।)`;
        
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML += `<div class="p-3 bg-cyan-950/40 border border-cyan-800/50 rounded-xl text-cyan-200">${welcomeMessage}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        
        speakResponse(welcomeMessage);
    }, 500);
});

function toggleVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser. Please use Chrome.");
        return;
    }
    const recognition = new SpeechRecognition();
    const langSelect = document.getElementById('chatLanguage');
    recognition.lang = langSelect ? langSelect.value : 'en-US';

    const micBtn = document.getElementById('micBtn');
    micBtn.classList.add('text-red-400', 'animate-pulse');

    recognition.onresult = function(event) {
        const speechToText = event.results[0][0].transcript;
        document.getElementById('chatInput').value = speechToText;
        micBtn.classList.remove('text-red-400', 'animate-pulse');
        handleChatQuery(); // Automatically send after voice input
    };

    recognition.onerror = function() {
        micBtn.classList.remove('text-red-400', 'animate-pulse');
    };
    recognition.onend = function() {
        micBtn.classList.remove('text-red-400', 'animate-pulse');
    };

    recognition.start();
}

function speakResponse(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/<[^>]*>?/gm, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        const langSelect = document.getElementById('chatLanguage');
        utterance.lang = langSelect ? langSelect.value : 'en-US';
        window.speechSynthesis.speak(utterance);
    }
}

async function handleChatQuery() {
    const chatInput = document.getElementById('chatInput');
    const chatBox = document.getElementById('chatBox');
    const query = chatInput.value.trim();
    if (!query) return;

    chatBox.innerHTML += `<div class="p-2 bg-slate-800 rounded-xl text-right text-slate-200">${escapeHtml(query)}</div>`;
    chatInput.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    setTimeout(() => {
        let reply = generateSmartReply(query);
        chatBox.innerHTML += `<div class="p-3 bg-cyan-950/40 border border-cyan-800/50 rounded-xl text-cyan-200">${reply}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        speakResponse(reply);
    }, 500);
}

function generateSmartReply(text) {
    const lowerText = text.toLowerCase();

    // Assamese / Local language checks
    if (lowerText.includes('নমস্কাৰ') || lowerText.includes('কেেনো') || lowerText.includes('অসমীয়া')) {
        return "নমস্কাৰ! AxomOps AI লজিস্টিকছলৈ আপোনাক স্বাগতম। আমাৰ চিষ্টেম আৰু লাইভ এআই এজেণ্ট সম্পূৰ্ণৰূপে সক্ৰিয় হৈ আছে। আপোনাক কি সহায় লাগে কওক?";
    }
    // Hindi checks
    else if (lowerText.includes('नमस्ते') || lowerText.includes('कैसे')) {
        return "नमस्ते! AxomOps AI लॉजिस्टिक्स कमांड में आपका स्वागत है। हमारा सिस्टम पूरी तरह से लाइव है। बताइए, मैं आपकी किस प्रकार सहायता कर सकता हूँ?";
    }
    // Tracking query
    else if (lowerText.includes('track') || lowerText.includes('status') || lowerText.includes('id') || lowerText.includes('shipment')) {
        return "📦 **Telemetry Status:** Your shipment pipeline is active. Please provide your 6-digit Tracking ID or Pincode for real-time tracking metrics.";
    }
    // Terrain / Route
    else if (lowerText.includes('hill') || lowerText.includes('terrain') || lowerText.includes('route') || lowerText.includes('tinsukia')) {
        return "⛰️ **Hill-Terrain Routing:** AxomOps AI monitors all mountain corridors across Tinsukia, Northeast, and remote sectors for safe dispatch.";
    }
    // General AI fallback answering any query intelligently
    else {
        return `🤖 **AxomOps AI Response:** I have analyzed your query regarding "${escapeHtml(text)}". Our logistics network is optimized for multi-lingual and real-time operations. Let me know if you need specific tracking or warehouse reports!`;
    }
}

function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}
</script>

</body>
</html>
