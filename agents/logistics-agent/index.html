<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxomOps AI Logistics Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-4">
            <h1 class="text-xl font-bold text-cyan-400">AxomOps AI Logistics Agent</h1>
            <select id="chatLanguage" class="bg-slate-800 border border-slate-700 text-sm rounded-lg p-1 text-slate-200">
                <option value="en-US">English</option>
                <option value="as-IN">Assamese</option>
            </select>
        </div>
        
        <div id="chatBox" class="h-80 overflow-y-auto space-y-3 mb-4 p-2 bg-slate-950 rounded-xl border border-slate-800/50 text-sm">
            <div class="p-3 bg-cyan-950/40 border border-cyan-800/50 rounded-xl text-cyan-200">
                Welcome to AxomOps AI Logistics. May I know your name please?
            </div>
        </div>

        <div class="flex items-center gap-2">
            <input type="text" id="chatInput" placeholder="Type or use mic..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
            <button id="micBtn" onclick="toggleVoiceInput()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-cyan-400">
                🎤
            </button>
            <button onclick="handleChatQuery()" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-semibold px-4 py-2 rounded-xl text-sm transition-all">
                Send
            </button>
        </div>
    </div>

    <script>
        let chatState = { step: 'GREETING', userName: '', userLocation: '', userIntent: '' };
        
        function toggleVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
                return;
            }
            const recognition = new SpeechRecognition();
            const langSelect = document.getElementById('chatLanguage');
            recognition.lang = langSelect ? langSelect.value : 'en-US';
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('text-red-400', 'animate-pulse');

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('chatInput').value = speechToText;
                micBtn.classList.remove('text-red-400', 'animate-pulse');
            };
            recognition.onerror = function() {
                micBtn.classList.remove('text-red-400', 'animate-pulse');
            };
            recognition.onend = function() {
                micBtn.classList.remove('text-red-400', 'animate-pulse');
            };
            recognition.start();
        }

        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                const cleanText = text.replace(/<[^>]*>?/gm, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                const langSelect = document.getElementById('chatLanguage');
                utterance.lang = langSelect ? langSelect.value : 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function handleChatQuery() {
            const chatInput = document.getElementById('chatInput');
            const chatBox = document.getElementById('chatBox');
            const query = chatInput.value.trim();
            if (!query) return;

            chatBox.innerHTML += `<div class="p-2 bg-slate-800 rounded-xl text-right text-slate-200">${escapeHtml(query)}</div>`;
            chatInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                let reply = "I'm ready! You can ask about tracking or delivery.";
                if (chatState.step === 'GREETING') {
                    chatState.userName = query;
                    chatState.step = 'READY';
                    reply = `Nice to meet you, ${escapeHtml(chatState.userName)}! How can I help you with logistics today?`;
                } else {
                    reply = `Got it regarding "${escapeHtml(query)}". Our system is fully operational!`;
                }

                chatBox.innerHTML += `<div class="p-3 bg-cyan-950/40 border border-cyan-800/50 rounded-xl text-cyan-200">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                speakResponse(reply);
            }, 400);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
